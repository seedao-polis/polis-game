[package]
name = "seedaodb"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
axum = "0.8.9"
base64 = "0.22.1"
dotenvy = "0.15.7"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite"] }
thiserror = "2.0.18"
tokio = { version = "1.52.4", features = ["full"] }
toml = "1.1.3"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["limit", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.4"
tempfile = "3.27.0"

[features]
default = []
# Enables the MySQL backend skeleton (db/mysql.rs). Left disabled by default
# since no MySQL driver dependency is pulled in until a real backend lands.
mysql-backend = []
